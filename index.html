<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dare to Rug</title>
<meta name="description" content="The shop is closed for now. The story continues in another form.">
<meta property="og:title" content="Dare to Rug">
<meta property="og:description" content="The shop is closed for now. The story continues in another form.">
<link rel="icon" type="image/png" href="assets/logo.png">
<style>
@font-face{font-family:'Nevis';src:url('assets/nevis.ttf') format('truetype');font-display:swap}
@font-face{font-family:'Gotham';src:url('assets/GothamBook.ttf') format('truetype');font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#000}
a{color:#000;text-decoration:none}
a:hover{text-decoration:underline}
.page{min-height:100vh;min-height:100dvh;padding:clamp(12px,2vw,28px);font-family:'Gotham',sans-serif}
.frame{min-height:calc(100vh - clamp(24px,4vw,56px));min-height:calc(100dvh - clamp(24px,4vw,56px));border:clamp(10px,1.4vw,20px) solid #000;padding:clamp(24px,4vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:48px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:32px;flex-wrap:wrap-reverse}
.copy{display:flex;flex-direction:column;gap:clamp(18px,2.2vw,32px);flex:1 1 320px}
h1{margin:0;font-family:'Nevis',sans-serif;font-weight:400;font-size:clamp(40px,7vw,108px);line-height:1;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:0;font-family:'Nevis',sans-serif;font-size:clamp(22px,2.8vw,42px);line-height:1.1;text-wrap:balance}
.logo{width:clamp(80px,11vw,170px);height:auto;display:block;flex:none}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;flex-wrap:wrap}
.contact{display:flex;flex-direction:column;gap:8px}
.label{font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.mail{font-family:'Nevis',sans-serif;font-size:clamp(22px,3vw,40px);line-height:1.1}
.social{font-size:15px;letter-spacing:.14em;text-transform:uppercase}
</style>
</head>
<body>
<div class="page">
  <div class="frame">
    <div class="top">
      <div class="copy">
        <h1>The shop is closed for&nbsp;now.</h1>
        <p class="sub">The story continues in another&nbsp;form.</p>
      </div>
      <img class="logo" src="assets/logo.png" alt="Dare to Rug">
    </div>
    <div class="bottom">
      <div class="contact">
        <span class="label">For information and collaborations</span>
        <a class="mail" href="mailto:hello@daretorug.com">hello@daretorug.com</a>
      </div>
      <a class="social" href="https://www.instagram.com/daretorug/" target="_blank" rel="noopener">Instagram ↗</a>
    </div>
  </div>
</div>
</body>
</html>
